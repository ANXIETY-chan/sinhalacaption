<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinhalaCaption.lk - Premium Sinhala Caption Generator</title>
    <!-- ඔයාගේ පරණ CSS ටික ඒ විදියටම තියෙනවා (ඉඩ ඉතුරු කරන්න මම CSS ටික skip කළා, ඔයාගේ CSS ටිකම මෙතන තියාගන්න) -->
    <style>
        /* ඔයා එවපු CSS ටික ඒ විදියටම මෙතන තියන්න... 
           කිසිම වෙනසක් කරන්න ඕන නෑ. */
    </style>
</head>
<body>

    <!-- ඔයාගේ HTML Body එක ඒ විදියටම තියන්න (Header, Hero, FAQ ඔක්කොම ඒ විදියටමයි) -->
    
    <!-- Script එක පමණක් මෙලෙස වෙනස් කරගන්න -->
    <script>
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                const textArea = document.getElementById('inputText');
                textArea.value += text;
                textArea.focus();
            } catch (err) {
                alert('Browser permission denied. Please use Ctrl+V.');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                generateCaption();
            }
        }

        async function generateCaption() {
            const inputText = document.getElementById('inputText').value.trim();
            const responseText = document.getElementById('responseText');
            const loader = document.getElementById('loader');
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            
            const addEmojis = document.getElementById('emojiToggle').checked;
            const addHashtags = document.getElementById('hashtagToggle').checked;

            if (!inputText) {
                alert('කරුණාකර මොනවාහරි ටයිප් කරන්න!');
                document.getElementById('inputText').focus();
                return;
            }

            // පරණ ටෙක්ස්ට් එක මකලා, අලුත් එක ලියවෙන්න ලෑස්ති කිරීම
            responseText.innerText = '';
            responseText.style.display = 'block';
            copyBtn.style.display = 'none';
            loader.style.display = 'block';
            generateBtn.disabled = true;
            responseText.style.color = "var(--primary-green)";

            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: inputText, addEmojis: addEmojis, addHashtags: addHashtags })
                });

                if (!response.ok) {
                    loader.style.display = 'none';
                    if (response.status === 429) {
                        responseText.innerText = "කණගාටුයි, දැනට ගොඩක් අය භාවිතා කරනවා. තත්පර කිහිපයකින් නැවත උත්සාහ කරන්න. ⏳";
                    } else {
                        responseText.innerText = "අවුලක් වුණා: කරුණාකර නැවත උත්සාහ කරන්න.";
                    }
                    responseText.style.color = "#dc2626";
                    generateBtn.disabled = false;
                    return;
                }

                // ChatGPT වගේ අකුරෙන් අකුර ටයිප් වීමේ (Streaming) ක්‍රියාවලිය
                loader.style.display = 'none';
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const dataStr = line.substring(6).trim();
                            if (dataStr === '[DONE]') break;
                            try {
                                const data = JSON.parse(dataStr);
                                if (data.candidates && data.candidates[0].content.parts[0].text) {
                                    // ලැබෙන වචන කොටස් එකින් එක එකතු කිරීම
                                    responseText.innerText += data.candidates[0].content.parts[0].text;
                                }
                            } catch (e) {
                                // චන්ක් එක කැඩිලා ආවොත් එන error එක ගණන් නොගැනීම
                            }
                        }
                    }
                }

                // ටයිප් වෙලා ඉවර වුණාම Copy button එක පෙන්නන්න
                copyBtn.style.display = 'block';

            } catch (error) {
                loader.style.display = 'none';
                responseText.innerText = "Network අවුලක්: " + error.message;
                responseText.style.color = "#dc2626";
            }

            generateBtn.disabled = false;
        }

        function copyToClipboard() {
            const textToCopy = document.getElementById('responseText').innerText;
            if(textToCopy === "" || textToCopy.includes("අවුලක් වුණා") || textToCopy.includes("කණගාටුයි")) return;
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = "Copied! ✅";
                setTimeout(() => { copyBtn.innerText = "📋 Copy"; }, 2000);
            }).catch(err => {
                alert("Copy කරන්න බැරි වුණා.");
            });
        }
    </script>
</body>
</html>
