<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinhalaCaption.lk</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(6, 78, 59, 0.12), 0 8px 10px -6px rgba(6, 78, 59, 0.08);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border-top: 6px solid #064e3b; 
        }
        
        .brand-logo {
            width: 220px;
            height: auto;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }
        .brand-logo:hover {
            transform: scale(1.02);
        }

        p.sub-text {
            color: #475569; 
            margin-bottom: 25px;
            font-size: 16px;
        }
        
        .textarea-container {
            position: relative;
            margin-bottom: 20px;
        }
        
        textarea {
            width: 100%;
            height: 130px;
            padding: 15px;
            padding-bottom: 45px; /* පහළින් බටන් එකට ඉඩ තැබීමට */
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
            color: #1e293b;
        }
        textarea:focus {
            border-color: #064e3b;
            box-shadow: 0 0 0 3px rgba(6, 78, 59, 0.1);
        }
        
        /* Paste Button - දැන් පහළට පැමිණ ඇත */
        .paste-btn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            color: #064e3b;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .paste-btn:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        button.generate-btn {
            width: 100%;
            background-color: #064e3b; 
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(6, 78, 59, 0.25);
        }
        button.generate-btn:hover {
            background-color: #022c22;
            transform: translateY(-1px);
        }
        button.generate-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .result-box {
            position: relative;
            padding: 20px;
            background-color: #f0fdf4; 
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            margin-top: 25px;
            text-align: left;
            display: none;
            min-height: 50px;
        }
        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #064e3b;
            transition: 0.2s;
        }
        .copy-btn:hover {
            transform: scale(1.1);
        }
        #responseText {
            margin: 0;
            padding-right: 35px;
            color: #064e3b;
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 1.6;
            font-weight: 500;
        }
        .loader {
            display: none;
            margin-top: 15px;
            color: #064e3b;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="logo.png" alt="SinhalaCaption.lk Logo" class="brand-logo">
    
    <p class="sub-text">Type in English, Singlish, or Sinhala 👇</p>
    
    <div class="textarea-container">
        <textarea id="inputText" placeholder="Write your thoughts here... (Press Enter)" onkeydown="handleKeyPress(event)"></textarea>
        <button class="paste-btn" onclick="pasteFromClipboard()" title="Paste Text">📋 Paste</button>
    </div>
    
    <button class="generate-btn" id="generateBtn" onclick="generateCaption()">ලස්සන සිංහලෙන් හදාගන්න ✨</button>
    <div id="loader" class="loader">කරුණාකර රැඳී සිටින්න... ⏳</div>
    
    <div class="result-box" id="resultBox">
        <button class="copy-btn" onclick="copyToClipboard()" title="Copy Text">📋</button>
        <p id="responseText"></p>
    </div>
</div>

<script>
    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            const textArea = document.getElementById('inputText');
            textArea.value = textArea.value + text;
        } catch (err) {
            alert('Paste කිරීමට Browser එකෙන් අවසර නොමැත. කරුණාකර Ctrl+V භාවිතා කරන්න.');
        }
    }

    // Enter එක එබූ විට ක්‍රියාත්මක වීමට (Shift + Enter මගින් අලුත් ලයින් එකකට යා හැක)
    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault(); // අලුත් ලයින් එකකට යාම වැළැක්වීම
            generateCaption();
        }
    }

    async function generateCaption() {
        const inputText = document.getElementById('inputText').value.trim();
        const resultBox = document.getElementById('resultBox');
        const responseText = document.getElementById('responseText');
        const loader = document.getElementById('loader');
        const generateBtn = document.getElementById('generateBtn');
        
        if (!inputText) {
            alert('කරුණාකර වාක්‍යයක් ඇතුළත් කරන්න!');
            return;
        }

        resultBox.style.display = 'none';
        loader.style.display = 'block';
        generateBtn.disabled = true;

        try {
            const response = await fetch('/api/gemini', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ prompt: inputText })
            });

            const data = await response.json();

            if (!response.ok) {
                if (data.error?.message?.includes('high demand')) {
                    responseText.innerText = "දෝෂයක්: සර්වර් එක කාර්යබහුලයි. කරුණාකර තත්පර කිහිපයකින් නැවත උත්සාහ කරන්න.";
                } else {
                    responseText.innerText = "දෝෂයක් සිදු විය: " + (data.error?.message || JSON.stringify(data));
                }
                resultBox.style.backgroundColor = "#fee2e2"; 
                resultBox.style.borderColor = "#fca5a5";
            } else {
                const generatedText = data.candidates[0].content.parts[0].text;
                responseText.innerText = generatedText;
                resultBox.style.backgroundColor = "#f0fdf4"; 
                resultBox.style.borderColor = "#bbf7d0";
            }
        } catch (error) {
            responseText.innerText = "Network දෝෂයක්: " + error.message;
            resultBox.style.backgroundColor = "#fee2e2";
            resultBox.style.borderColor = "#fca5a5";
        }

        loader.style.display = 'none';
        resultBox.style.display = 'block';
        generateBtn.disabled = false;
    }

    function copyToClipboard() {
        const textToCopy = document.getElementById('responseText').innerText;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("සාර්ථකව Copy කරගන්නා ලදී! ✅");
        }).catch(err => {
            alert("Copy කිරීම අසාර්ථකයි.");
        });
    }
</script>
</body>
</html>
